name: ThreatLens Core CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: ⬢ Static Code Analysis & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 "black==21.12b0" mypy
          python -m pip install "click<8.1.0" black

      - name: Code Formatting Check (Black)
        run: black --check app/

      - name: Linting Verification (Flake8)
        run: flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

  test-and-coverage:
    name: 🧪 Automated Test Suite & Quality Gates
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Spin Up Ephemeral Testing Stack (Docker Compose)
        run: |
          docker-compose -f docker-compose.yml up -d postgres redis elasticsearch
          echo "Waiting for core backing services to clear initialization flags..."
          sleep 15

      - name: Build and Execute Test Containers with Coverage Gate
        run: |
          docker compose -f docker compose.yml build api
          docker compose -f docker compose.yml run api pytest app/tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Tear Down Ephemeral Container Stack
        if: always()
        run: docker-compose -f docker-compose.yml down -v

  security-scan:
    name: 🛡️ Dependency & Image Security Auditing
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Vulnerability Scan on Backend Codebase (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1' # Fails build if Vulnerabilities are found
          severity: 'CRITICAL,HIGH'

      - name: Build Application Image for Container Audit
        run: docker build -t threatlens-api:latest .

      - name: Vulnerability Scan on Compiled Docker Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'threatlens-api:latest'
          format: 'table'
          exit-code: '1' # Fails build if Critical/High Image issues exist
          severity: 'CRITICAL,HIGH'

  build-and-package:
    name: 📦 Production Artifact Package
    runs-on: ubuntu-latest
    needs: [test-and-coverage, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # Set to true and add credentials step once DockerHub/ECR registries are pinned
          tags: threatlens-api:latest
