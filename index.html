<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinova ThreatLens - Security Dashboard</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-gray-900 text-gray-100 font-sans">

    <!-- Top Navigation Bar -->
    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-shield-halved text-teal-400 text-2xl"></i>
            <span class="text-xl font-bold tracking-wider bg-gradient-to-r bg-clip-text text-transparent from-teal-400 to-blue-500">
                SENTINOVA THREATLENS
            </span>
        </div>
        <div class="flex items-center space-x-4">
            <span class="bg-teal-500/10 text-teal-400 text-xs px-2.5 py-1 rounded-full border border-teal-500/20 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span> Static Mode (GitHub Pages)
            </span>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto p-6 space-y-6">

        <!-- Metrics Overview Grid -->
        <section class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-400 font-medium uppercase tracking-wider">Threat Indicators</p>
                    <h3 class="text-3xl font-bold mt-1" id="total-indicators">1,248</h3>
                </div>
                <div class="p-3 bg-blue-500/10 text-blue-400 rounded-lg"><i class="fa-solid fa-circle-nodes text-xl"></i></div>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-400 font-medium uppercase tracking-wider">High Risk Alerts</p>
                    <h3 class="text-3xl font-bold mt-1 text-red-400" id="high-alerts">42</h3>
                </div>
                <div class="p-3 bg-red-500/10 text-red-400 rounded-lg"><i class="fa-solid fa-triangle-exclamation text-xl"></i></div>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-400 font-medium uppercase tracking-wider">Enriched Nodes</p>
                    <h3 class="text-3xl font-bold mt-1 text-teal-400" id="enriched-nodes">94.2%</h3>
                </div>
                <div class="p-3 bg-teal-500/10 text-teal-400 rounded-lg"><i class="fa-solid fa-wand-magic-sparkles text-xl"></i></div>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-400 font-medium uppercase tracking-wider">Avg Risk Score</p>
                    <h3 class="text-3xl font-bold mt-1 text-yellow-400" id="avg-score">68.4</h3>
                </div>
                <div class="p-3 bg-yellow-500/10 text-yellow-400 rounded-lg"><i class="fa-solid fa-gauge-high text-xl"></i></div>
            </div>
        </section>

        <!-- Live Intelligence Feed -->
        <section class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-700 flex items-center justify-between bg-gray-800/50">
                <h2 class="text-lg font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-bolt text-yellow-400"></i> Indicators Intelligence Stream
                </h2>
                <span class="text-xs text-gray-400">Simulating live background streaming tasks</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-900/50 text-xs font-semibold text-gray-400 uppercase border-b border-gray-700">
                            <th class="px-6 py-3">Indicator</th>
                            <th class="px-6 py-3">Type</th>
                            <th class="px-6 py-3">Source/Enrichment</th>
                            <th class="px-6 py-3">Risk Score</th>
                            <th class="px-6 py-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="indicators-table-body" class="divide-y divide-gray-700 text-sm">
                        <!-- Simulated dynamic rows appear here -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Simulated Client-Side Frontend Logic (Replacing FastAPI and Websockets) -->
    <script>
        const types = ['IP Address', 'Domain', 'File Hash (SHA-256)', 'URL'];
        const enrichments = ['VirusTotal', 'AlienVault OTX', 'CrowdStrike Falcon', 'Shodan', 'AbuseIPDB'];
        const statuses = ['Active Block', 'Investigating', 'Whitelisted', 'Flagged'];

        function generateRandomIndicator() {
            const type = types[Math.floor(Math.random() * types.length)];
            let value = '';
            if (type === 'IP Address') {
                value = `185.${Math.floor(Math.random() * 254)}.${Math.floor(Math.random() * 254)}.${Math.floor(Math.random() * 254)}`;
            } else if (type === 'Domain') {
                value = `malware-cnc-server-${Math.floor(Math.random() * 999)}.ru`;
            } else if (type === 'URL') {
                value = `https://secure-login-verify-${Math.floor(Math.random() * 100)}.com/update`;
            } else {
                value = Array.from({length: 16}, () => Math.floor(Math.random()*16).toString(16)).join('') + '...';
            }

            const score = Math.floor(Math.random() * 65) + 35;
            const source = enrichments[Math.floor(Math.random() * enrichments.length)];
            const status = statuses[Math.floor(Math.random() * statuses.length)];

            return { value, type, source, score, status };
        }

        function renderRow(data) {
            let scoreClass = 'text-green-400 bg-green-500/10 border-green-500/20';
            if (data.score >= 80) scoreClass = 'text-red-400 bg-red-500/10 border-red-500/20';
            else if (data.score >= 60) scoreClass = 'text-yellow-400 bg-yellow-500/10 border-yellow-500/20';

            return `
                <tr class="hover:bg-gray-700/30 transition-colors animate-[fadeIn_0.5s_ease-out]">
                    <td class="px-6 py-4 font-mono text-gray-200">${data.value}</td>
                    <td class="px-6 py-4 text-gray-400">${data.type}</td>
                    <td class="px-6 py-4"><span class="text-xs bg-gray-700 px-2 py-1 rounded text-teal-300 font-mono">${data.source}</span></td>
                    <td class="px-6 py-4">
                        <span class="text-xs px-2 py-0.5 font-semibold rounded border ${scoreClass}">
                            ${data.score}
                        </span>
                    </td>
                    <td class="px-6 py-4">
                        <span class="text-xs font-medium text-gray-300 flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full ${data.status === 'Active Block' ? 'bg-red-500' : 'bg-yellow-500'}"></span>
                            ${data.status}
                        </span>
                    </td>
                </tr>
            `;
        }

        const tableBody = document.getElementById('indicators-table-body');
        
        // Initial Seed
        for(let i=0; i < 6; i++) {
            tableBody.innerHTML += renderRow(generateRandomIndicator());
        }

        // Simulate Live Realtime WebSocket Updates every 3.5 seconds
        setInterval(() => {
            const newIndicator = generateRandomIndicator();
            tableBody.insertAdjacentHTML('afterbegin', renderRow(newIndicator));
            
            if (tableBody.children.length > 12) {
                tableBody.removeChild(tableBody.lastChild);
            }
        }, 3500);
    </script>
</body>
</html>
