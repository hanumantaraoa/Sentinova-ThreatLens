<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinova ThreatLens - Security Dashboard</title>
	<style>
   body { font-family: font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #02e8f0; padding: 5px; }
   h1 { color: #f43f5e; border-bottom: 2px solid #334155; padding-bottom: 10px; }
   h2 { color: #5f9075; border-bottom: 1px solid #334155; padding-bottom: 8px; }
   h3 { color: #340fff; border-bottom: 1px solid #334155; padding-bottom: 6px; }
   .grid { display: flex; justify-content: center;
            align-items: left; gap: 40px; box-sizing: content-box; }
   
   table { color: #0ff860; width: 100%; border-collapse: collapse; margin-top: 10px; }
            td { color: #0ff860; font-size: 10px; text-align: left; padding: 10px; border-bottom: 1px solid #f8fafc; font-size: 13px; }
            th { color: #0ff860; font-size: 15px; text-align: left; padding: 6px; background-color: #334155; color: #88fafc; }
            
</style>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <!-- Top Navigation Bar -->
    
        <div>
            <i class="fa-solid fa-shield-halved text-teal-400 text-2xl"></i>
            <span class="text-xl font-bold tracking-wider bg-gradient-to-r bg-clip-text text-transparent from-teal-400 to-blue-500">
              <h2 style= "color: #f43f5e; ">  SENTINOVA THREATLENS</h2>
            </span>
        </div>
        
                <p style= "color: #5f9075; justify-content: center;"> Static Mode (GitHub Pages)</p>
        </div>



    <!-- Main Container -->
    

        <!-- Metrics Overview Grid -->
        <section class="grid">
            <div>
                <div>
                    <p>Threat Indicators</p>
                    <h3>1,248</h3>
                </div>
                
            </div>
            <div>
                <div>
                    <p>High Risk Alerts</p>
                    <h3>42</h3>
                </div>
                <div><i class="fa-solid fa-triangle-exclamation text-xl"></i></div>
            </div>
            <div>
                <div>
                    <p>Enriched Nodes</p>
                    <h3>94.2%</h3>
                </div>
                <div class="p-3 bg-teal-500/10 text-teal-400 rounded-lg"><i class="fa-solid fa-wand-magic-sparkles text-xl"></i></div>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-400 font-medium uppercase tracking-wider">Avg Risk Score</p>
                    <h3>68.4</h3>
                </div>
                <div><i class="fa-solid fa-gauge-high text-xl"></i></div>
            </div>
        </section>

        <!-- Live Intelligence Feed -->
        <section>
            <div>
                <h2 style= "color: #f43f5e; justify-content: center;">
                     Indicators Intelligence Stream
                </h2>
                <span class="text-xs text-gray-400">Simulating live background streaming tasks</span>
            </div>
            <div>
                <table>
                    <thead>
                        <tr>
                            <th>Indicator</th>
                            <th>Type</th>
                            <th>Source/Enrichment</th>
                            <th>Risk Score</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="indicators-table-body">
                        <!-- Simulated dynamic rows appear here -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Simulated Client-Side Frontend Logic (Replacing FastAPI and Websockets) -->
    <script>
        const types = ['IP Address', 'Domain', 'File Hash (SHA-256)', 'URL'];
        const enrichments = ['VirusTotal', 'AlienVault OTX', 'CrowdStrike Falcon', 'Shodan', 'AbuseIPDB'];
        const statuses = ['Active Block', 'Investigating', 'Whitelisted', 'Flagged'];

        function generateRandomIndicator() {
            const type = types[Math.floor(Math.random() * types.length)];
            let value = '';
            if (type === 'IP Address') {
                value = `185.${Math.floor(Math.random() * 254)}.${Math.floor(Math.random() * 254)}.${Math.floor(Math.random() * 254)}`;
            } else if (type === 'Domain') {
                value = `malware-cnc-server-${Math.floor(Math.random() * 999)}.ru`;
            } else if (type === 'URL') {
                value = `https://secure-login-verify-${Math.floor(Math.random() * 100)}.com/update`;
            } else {
                value = Array.from({length: 16}, () => Math.floor(Math.random()*16).toString(16)).join('') + '...';
            }

            const score = Math.floor(Math.random() * 65) + 35;
            const source = enrichments[Math.floor(Math.random() * enrichments.length)];
            const status = statuses[Math.floor(Math.random() * statuses.length)];

            return { value, type, source, score, status };
        }

        function renderRow(data) {
            let scoreClass = 'text-green-400 bg-green-500/10 border-green-500/20';
            if (data.score >= 80) scoreClass = 'text-red-400 bg-red-500/10 border-red-500/20';
            else if (data.score >= 60) scoreClass = 'text-yellow-400 bg-yellow-500/10 border-yellow-500/20';

            return `
                <tr>
                    <td>${data.value}</td>
                    <td>${data.type}</td>
                    <td>${data.source}</td>
                    <td>${data.score}</td>
                    <td>
                              <span class="w-1.5 h-1.5 rounded-full ${data.status === 'Active Block' ? 'bg-red-500' : 'bg-yellow-500'}"></span>
                            ${data.status}
                        </span>
                    </td>
                </tr>
            `;
        }

        const tableBody = document.getElementById('indicators-table-body');
        
        // Initial Seed
        for(let i=0; i < 6; i++) {
            tableBody.innerHTML += renderRow(generateRandomIndicator());
        }

        // Simulate Live Realtime WebSocket Updates every 3.5 seconds
        setInterval(() => {
            const newIndicator = generateRandomIndicator();
            tableBody.insertAdjacentHTML('afterbegin', renderRow(newIndicator));
            
            if (tableBody.children.length > 12) {
                tableBody.removeChild(tableBody.lastChild);
            }
        }, 3500);
    </script>
</body>
</html>
